<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Amorçage du thème AVANT le premier paint : évite le flash blanc
         et garantit que la matière est posée même si le module React est
         lent. Répète exactement la logique de useTheme.js :
           1. l'état initial est 'light' (Papier Tactile) ;
           2. un choix manuel dans localStorage prime sur le système ;
           3. sinon, la préférence système tranche.
         L'ancienne clé 'agroci:theme' est lue puis migrée vers 'theme'. */
      (function () {
        var STORAGE_KEY = 'theme'
        var LEGACY_KEY = 'agroci:theme'
        var theme = 'light'
        try {
          var stored = window.localStorage.getItem(STORAGE_KEY)
          if (stored !== 'light' && stored !== 'dark') {
            var legacy = window.localStorage.getItem(LEGACY_KEY)
            if (legacy === 'light' || legacy === 'dark') {
              stored = legacy
              window.localStorage.setItem(STORAGE_KEY, legacy)
              window.localStorage.removeItem(LEGACY_KEY)
            }
          }
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (error) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B4332" />
    <meta name="description" content="AgroCI+ accompagne les planteurs de cacao et de café en Côte d'Ivoire." />
    <link rel="icon" media="(prefers-color-scheme: light)" href="/assets/logo-light.png" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme: dark)" href="/assets/logo-dark.png" type="image/png" />
    <title>AgroCI+ · Votre compagnon de champ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
